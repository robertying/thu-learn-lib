name: Release

# Push a `v*` tag that matches package.json's version to publish to npm and
# create a GitHub release.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

# Only the publish job can write: the reused checks get read access.
permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing + provenance
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prepublishOnly` builds lib/. Uses npm trusted publishing (OIDC), so no token.
      # Skipped when this version is already on npm (e.g. published by hand).
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
